<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Direito para o CFC</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#fff0f0,#eef4ff);
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    background: linear-gradient(135deg,#7a0000,#c40000,#ff4d4d);
    color:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
    margin-bottom:25px;
}

.score{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#8b0000;
    margin-bottom:15px;
}

.contador{
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
    color:#444;
}

.card{
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    min-height:520px;
    page-break-after:always;
}

.card h3{
    color:#8b0000;
    line-height:1.7;
    margin-bottom:25px;
}

.alternativa{
    background:#fff5f5;
    border:2px solid #ffd0d0;
    padding:16px;
    margin:12px 0;
    border-radius:16px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

.alternativa:hover{
    background:#ffe0e0;
    transform:scale(1.01);
}

.correta{
    background:#d9ffd9!important;
    border-color:#1d9f1d!important;
}

.errada{
    background:#ffd6d6!important;
    border-color:#d00000!important;
}

.resposta{
    display:none;
    background:#fff7d9;
    border-left:6px solid #d00000;
    padding:18px;
    border-radius:12px;
    margin-top:25px;
    line-height:1.6;
}

.exibir .resposta{
    display:block;
}

.botoes{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

button{
    background: linear-gradient(135deg,#8b0000,#d60000,#ff4d4d);
    color:white;
    border:none;
    padding:14px 22px;
    border-radius:15px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

@media print{

    body{
        background:white;
    }

    .header,
    .score,
    .contador,
    .botoes-navegacao{
        display:none;
    }

    .card{
        box-shadow:none;
        border:1px solid #ccc;
        min-height:auto;
    }

    .sem-resposta .resposta{
        display:none!important;
    }

    .com-resposta .resposta{
        display:block!important;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</h1>
<h2>Quiz Dinâmico – Direito para o CFC</h2>
<p>Uma questão por página • Navegação dinâmica • PDF com ou sem respostas</p>
</div>

<div class="score" id="score">Pontuação: 0 / 15</div>

<div class="contador" id="contador"></div>

<div id="quiz"></div>

</div>

<script>

const questoes = [

{
q:"01. João comunicou a Maria que: I. a Lei nº X, editada pela União, disciplinou as situações em que poderia ocorrer a renúncia a determinada posição jurídica; II. a renúncia, para ser válida, deveria observar os estritos termos legais; III. Pedro renunciou a um direito que deixou de integrar a sua esfera jurídica e passou a integrar a esfera jurídica de Maria. Nas situações I, II e III, estamos perante, respectivamente:",
a:[
"A) poder estatal, direito positivo e direito natural.",
"B) direito objetivo, direito natural e faculdade jurídica.",
"C) direito positivo, direito objetivo e direito subjetivo.",
"D) direito subjetivo, direito natural e dinâmica relacional."
],
c:2,
r:"Gabarito: C. Direito positivo é a norma criada pelo Estado; direito objetivo é a regra jurídica em si; direito subjetivo é o poder individual protegido juridicamente."
},

{
q:"02. Pedro é empregado há três anos da sociedade Alfa. Maria decidiu demiti-lo e consultou o RH sobre o aviso prévio. A informação correta é:",
a:[
"A) Alfa pode optar por deixá-lo em casa sem remuneração.",
"B) O aviso prévio será de 30 dias.",
"C) É necessário pagar indenização correspondente a um mês.",
"D) O aviso prévio será de 39 dias."
],
c:3,
r:"Gabarito: D. O aviso prévio proporcional soma 3 dias por ano completo de serviço."
},

{
q:"03. A sociedade Delta vende livros. Sobre os tributos que deve recolher:",
a:[
"A) não recolheria nenhum tributo.",
"B) somente recolheria impostos.",
"C) recolheria taxas.",
"D) somente recolheria contribuições de melhoria."
],
c:2,
r:"Gabarito: C. Livros possuem imunidade de impostos, mas continuam sujeitos a taxas."
},

{
q:"04. João foi cobrado por associação de moradores sem nunca ter se associado. É correto afirmar:",
a:[
"A) associação obrigatória.",
"B) João decide se quer se associar.",
"C) Município pode obrigar associação.",
"D) associações não podem cobrar mensalidades."
],
c:1,
r:"Gabarito: B. A Constituição garante liberdade de associação."
},

{
q:"05. A empresa Alfa deseja fornecer móveis ao Estado Beta. Foi corretamente informada de que:",
a:[
"A) contratos seguem sempre o direito privado.",
"B) todo contrato exige licitação sem exceção.",
"C) ressalvadas as exceções legais, contrato administrativo exige licitação.",
"D) licitação só ocorre quando houver interesse."
],
c:2,
r:"Gabarito: C. Licitação é regra; dispensa e inexigibilidade são exceções."
},

{
q:"06. Sobre previdência e assistência social:",
a:[
"A) ambas são contributivas.",
"B) assistência social independe de contribuição.",
"C) assistência se confunde com previdência.",
"D) assistência é espécie de previdência."
],
c:1,
r:"Gabarito: B. Assistência social é não contributiva."
},

{
q:"07. Segundo o Código Civil, a renúncia à prescrição:",
a:[
"A) não é admitida.",
"B) deve ser sempre expressa.",
"C) só pode ocorrer depois da consumação.",
"D) pode ocorrer antes ou depois."
],
c:2,
r:"Gabarito: C. Só pode ocorrer após a prescrição consumada."
},

{
q:"08. João e Maria morreram no mesmo acidente sem saber quem faleceu primeiro:",
a:[
"A) o mais velho faleceu primeiro.",
"B) o mais jovem faleceu primeiro.",
"C) faleceram ao mesmo tempo.",
"D) depende do inventário."
],
c:2,
r:"Gabarito: C. Trata-se de comoriência."
},

{
q:"09. Decisão administrativa com eficácia normativa entra em vigor:",
a:[
"A) na publicação.",
"B) 30 dias após publicação.",
"C) 90 dias após publicação.",
"D) exercício financeiro seguinte."
],
c:1,
r:"Gabarito: B. Regra do CTN."
},

{
q:"10. São princípios da Administração Pública:",
a:[
"A) I e II.",
"B) II, III e IV.",
"C) I, II e IV.",
"D) I, II, III e IV."
],
c:2,
r:"Gabarito: C. Legalidade, moralidade e publicidade."
},

{
q:"11. Sobre limitações ao poder de tributar:",
a:[
"A) Noventena não vale para contribuições sociais.",
"B) Legalidade exige lei complementar.",
"C) Isonomia garante igualdade.",
"D) Irretroatividade impede lei interpretativa."
],
c:2,
r:"Gabarito: C. Princípio da isonomia tributária."
},

{
q:"12. Sobre obrigação tributária:",
a:[
"A) ISS e ICMS são estaduais.",
"B) Obrigação principal é pagar; acessória envolve deveres instrumentais.",
"C) IRPJ é tributo indireto.",
"D) Lucro é fato gerador do ICMS."
],
c:1,
r:"Gabarito: B."
},

{
q:"13. Para o contador que atua no setor público ou na fiscalização de contratos administrativos, o conhecimento da Lei nº 14.133, de 1º de abril de 2021, é fundamental para a avaliação da legalidade e conformidade dos gastos públicos. O Art. 5º dessa Lei elenca diversos princípios que devem guiar a atuação das Administrações Públicas diretas, autárquicas e fundacionais da União, dos Estados, do Distrito Federal e dos Municípios. Com base no texto legal, avalie os seguintes princípios: I. Impessoalidade; II. Transparência; III. Racionalidade econômica; IV. Probidade administrativa. Estão expressamente listados no Art. 5º da Lei os princípios:",
a:[
"A) I e IV, apenas.",
"B) II e III, apenas.",
"C) I, II e IV, apenas.",
"D) I, II, III e IV."
],
c:2,
r:"Gabarito: C. Impessoalidade, transparência e probidade administrativa estão expressamente previstos na Lei nº 14.133/2021."
},

{
q:"14. Segundo o CTN, tributo é:",
a:[
"A) prestação voluntária.",
"B) sanção de ato ilícito.",
"C) prestação em bens.",
"D) prestação pecuniária compulsória instituída em lei."
],
c:3,
r:"Gabarito: D."
},

{
q:"15. Segundo a LC nº 123/2006:",
a:[
"A) ME até R$120 mil.",
"B) ME até R$360 mil e EPP até R$4,8 milhões.",
"C) MEI e EPP possuem mesmo limite.",
"D) limites definidos por decreto."
],
c:1,
r:"Gabarito: B."
}

];

let atual = 0;
let pontos = 0;
let respondidas = Array(questoes.length).fill(false);

function carregarQuestao(){

    const q = questoes[atual];

    document.getElementById("contador").innerHTML =
    `Questão ${atual+1} de ${questoes.length}`;

    document.getElementById("quiz").innerHTML = `

    <div class="card" id="card">

        <h3>${q.q}</h3>

        ${q.a.map((alt,i)=>`
            <div class="alternativa" onclick="responder(${i},this)">
                ${alt}
            </div>
        `).join("")}

        <div class="resposta">
            ${q.r}
        </div>

        <div class="botoes botoes-navegacao">

            <button onclick="voltar()">⬅️ Voltar</button>

            <button onclick="mostrarResposta()">👁️ Mostrar Resposta</button>

            <button onclick="proxima()">Próxima ➡️</button>

            <button onclick="imprimirComResposta()">📄 PDF com Respostas</button>

            <button onclick="imprimirSemResposta()">📄 PDF sem Respostas</button>

        </div>

    </div>

    `;
}

function responder(i,el){

    if(respondidas[atual]) return;

    respondidas[atual] = true;

    const card = document.getElementById("card");
    const alternativas = card.querySelectorAll(".alternativa");

    alternativas.forEach((alt,index)=>{

        if(index===questoes[atual].c){
            alt.classList.add("correta");
        }

        if(index===i && i!==questoes[atual].c){
            alt.classList.add("errada");
        }

    });

    if(i===questoes[atual].c){
        pontos++;
    }

    card.classList.add("exibir");

    atualizarScore();
}

function atualizarScore(){
    document.getElementById("score").innerHTML =
    `Pontuação: ${pontos} / ${questoes.length}`;
}

function mostrarResposta(){
    document.getElementById("card").classList.add("exibir");
}

function proxima(){
    if(atual < questoes.length-1){
        atual++;
        carregarQuestao();
    }
}

function voltar(){
    if(atual > 0){
        atual--;
        carregarQuestao();
    }
}

function gerarTodas(){

    const quiz = document.getElementById("quiz");

    quiz.innerHTML = "";

    questoes.forEach((q)=>{

        quiz.innerHTML += `

        <div class="card">

            <h3>${q.q}</h3>

            ${q.a.map(a=>`
                <div class="alternativa">${a}</div>
            `).join("")}

            <div class="resposta">${q.r}</div>

        </div>

        `;
    });
}

function imprimirComResposta(){

    document.body.classList.remove("sem-resposta");
    document.body.classList.add("com-resposta");

    gerarTodas();

    window.print();

    carregarQuestao();
}

function imprimirSemResposta(){

    document.body.classList.remove("com-resposta");
    document.body.classList.add("sem-resposta");

    gerarTodas();

    window.print();

    carregarQuestao();
}

carregarQuestao();

</script>

</body>
</html>
