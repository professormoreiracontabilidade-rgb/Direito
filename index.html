<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz Direito para o CFC</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#fff1f1,#eef4ff);
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  background:linear-gradient(135deg,#8b0000,#d60000,#ff4d4d);
  color:white;
  padding:25px;
  border-radius:22px;
  text-align:center;
  margin-bottom:25px;
  box-shadow:0 8px 20px #0003;
}

.card{
  background:white;
  padding:30px;
  border-radius:22px;
  box-shadow:0 8px 25px #0002;
  min-height:520px;
  page-break-after:always;
}

h3{
  color:#8b0000;
  line-height:1.5;
}

.alternativa{
  background:#fff3f3;
  border:1px solid #ffc1c1;
  margin:12px 0;
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
}

.alternativa:hover{
  background:#ffe0e0;
}

.correta{
  background:#d8ffd8!important;
  border-color:#20a020;
}

.errada{
  background:#ffd1d1!important;
  border-color:#cc0000;
}

.resposta{
  display:none;
  background:#fff7d6;
  border-left:6px solid #d60000;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
  line-height:1.5;
}

.exibir .resposta{
  display:block;
}

.botoes{
  margin-top:25px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}

button{
  background:linear-gradient(135deg,#8b0000,#d60000,#ff4d4d);
  color:white;
  border:none;
  padding:14px 22px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 5px 14px #0003;
}

button:hover{
  transform:scale(1.04);
}

.score{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
  color:#8b0000;
}

.contador{
  text-align:center;
  margin-bottom:15px;
  font-weight:bold;
  color:#555;
}

@media print{
  body{
    background:white;
  }

  .header,.score,.contador,.botoes-navegacao{
    display:none;
  }

  .card{
    box-shadow:none;
    border:1px solid #ccc;
    min-height:auto;
  }

  .sem-resposta .resposta{
    display:none!important;
  }

  .com-resposta .resposta{
    display:block!important;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</h1>
  <h2>Quiz Dinâmico – Direito para o CFC</h2>
  <p>Uma questão por página • Navegação com setas • Impressão com ou sem gabarito</p>
</div>

<div class="score" id="score">Pontuação: 0 / 15</div>
<div class="contador" id="contador"></div>

<div id="quiz"></div>

</div>

<script>
const questoes = [
{
q:"01. João comunicou a Maria que: I. a Lei nº X, editada pela União, disciplinou as situações em que poderia ocorrer a renúncia a determinada posição jurídica; II. a renúncia, para ser válida, deveria observar os estritos termos legais; III. Pedro renunciou a um direito que deixou de integrar a sua esfera jurídica e passou a integrar a esfera jurídica de Maria. Nas situações I, II e III, estamos perante, respectivamente:",
a:["A) poder estatal, direito positivo e direito natural.","B) direito objetivo, direito natural e faculdade jurídica.","C) direito positivo, direito objetivo e direito subjetivo.","D) direito subjetivo, direito natural e dinâmica relacional."],
c:2,
r:"Gabarito: C. Direito positivo é a norma criada pelo Estado; direito objetivo é a regra jurídica em si; direito subjetivo é o poder individual de exigir ou dispor de algo protegido juridicamente."
},
{
q:"02. Pedro é empregado há três anos da sociedade Alfa. Maria decidiu demiti-lo e consultou o RH sobre o aviso prévio. A informação correta é:",
a:["A) Alfa pode optar por deixá-lo em casa sem remuneração.","B) O aviso prévio será de 30 dias.","C) É necessário pagar indenização correspondente a um mês.","D) O aviso prévio será de 39 dias."],
c:3,
r:"Gabarito: D. Pela Lei nº 12.506/2011, o aviso prévio é de 30 dias mais 3 dias por ano completo de serviço. Como Pedro tem 3 anos: 30 + 9 = 39 dias."
},
{
q:"03. A sociedade Delta vende livros. Sobre os tributos que deve recolher, o contador respondeu corretamente que Delta:",
a:["A) não recolheria nenhum tributo.","B) somente recolheria impostos.","C) recolheria taxas.","D) somente recolheria contribuições de melhoria."],
c:2,
r:"Gabarito: C. Livros possuem imunidade de impostos, mas isso não elimina a cobrança de taxas."
},
{
q:"04. João foi cobrado por associação de moradores, embora nunca tenha se associado. É correto afirmar que:",
a:["A) a associação é obrigatória e o débito é devido.","B) cabe a João decidir se irá se associar, logo o débito é indevido.","C) se autorizada pelo Município, a associação é obrigatória.","D) associações não podem cobrar mensalidades."],
c:1,
r:"Gabarito: B. A Constituição garante liberdade de associação. Ninguém é obrigado a se associar."
},
{
q:"05. A empresa Alfa deseja fornecer móveis ao Estado Beta. Foi corretamente informada de que:",
a:["A) contratos do Estado seguem sempre o direito privado.","B) todo contrato do Estado deve ser antecedido de licitação, sem exceção.","C) ressalvadas as exceções legais, contrato administrativo exige licitação.","D) licitação só ocorre quando a autoridade quiser."],
c:2,
r:"Gabarito: C. A licitação é regra para contratação pública, salvo hipóteses legais de dispensa ou inexigibilidade."
},
{
q:"06. Sobre previdência e assistência social, é correto afirmar que:",
a:["A) ambas têm caráter necessariamente contributivo.","B) a assistência social assegura benefícios independentemente de contribuição.","C) a assistência social se confunde com previdência pública.","D) assistência social é uma forma de previdência social."],
c:1,
r:"Gabarito: B. Previdência é contributiva; assistência social é não contributiva."
},
{
q:"07. Segundo o Código Civil, a renúncia à prescrição:",
a:["A) não é admitida.","B) deve ser sempre expressa.","C) só pode ser realizada depois que a prescrição se consumar.","D) pode ocorrer antes ou depois da prescrição."],
c:2,
r:"Gabarito: C. A renúncia à prescrição só pode ocorrer depois de consumada."
},
{
q:"08. João e Maria faleceram no mesmo acidente, sem saber quem morreu primeiro. Presume-se que:",
a:["A) o mais velho faleceu primeiro.","B) o mais jovem faleceu primeiro.","C) faleceram ao mesmo tempo.","D) quem teve inventário aberto antes faleceu primeiro."],
c:2,
r:"Gabarito: C. Trata-se de comoriência: presume-se morte simultânea."
},
{
q:"09. Decisão administrativa com eficácia normativa entra em vigor, salvo disposição contrária:",
a:["A) na data da publicação.","B) trinta dias após a publicação.","C) noventa dias após a publicação.","D) no exercício financeiro seguinte."],
c:1,
r:"Gabarito: B. Pelo CTN, atos normativos tributários entram em vigor 30 dias após a publicação."
},
{
q:"10. São princípios da Administração Pública: I. legalidade; II. moralidade; III. livre concorrência; IV. publicidade.",
a:["A) I e II, apenas.","B) II, III e IV, apenas.","C) I, II e IV, apenas.","D) I, II, III e IV."],
c:2,
r:"Gabarito: C. Legalidade, moralidade e publicidade fazem parte do LIMPE. Livre concorrência é princípio da ordem econômica."
},
{
q:"11. Sobre limitações ao poder de tributar, assinale a correta:",
a:["A) Noventena não se aplica às contribuições sociais.","B) Legalidade exige sempre lei complementar.","C) Isonomia veda tratamento desigual a contribuintes em situação equivalente.","D) Irretroatividade impede até lei interpretativa."],
c:2,
r:"Gabarito: C. A isonomia tributária garante tratamento igual aos contribuintes em situação equivalente."
},
{
q:"12. Sobre obrigação tributária, assinale a correta:",
a:["A) ISS e ICMS são ambos de competência estadual.","B) Obrigação principal é pagar; obrigação acessória envolve deveres instrumentais.","C) IRPJ é tributo indireto.","D) Fato gerador do ICMS é o lucro."],
c:1,
r:"Gabarito: B. Obrigação principal é pagar; obrigação acessória envolve deveres como declarar, emitir nota e escriturar."
},
{
q:"13. No art. 5º da Lei nº 14.133/2021, são princípios expressos:",
a:["A) I e IV, apenas.","B) II e III, apenas.","C) I, II e IV, apenas.","D) I, II, III e IV."],
c:2,
r:"Gabarito: C. Impessoalidade, transparência e probidade administrativa estão previstos. Racionalidade econômica não está expressamente listada."
},
{
q:"14. Segundo o CTN, tributo é:",
a:["A) prestação pecuniária voluntária.","B) sanção de ato ilícito.","C) prestação em bens instituída por qualquer ato normativo.","D) prestação pecuniária compulsória, em moeda ou equivalente, que não seja sanção de ato ilícito, instituída em lei e cobrada mediante atividade plenamente vinculada."],
c:3,
r:"Gabarito: D. Essa é a definição do art. 3º do CTN."
},
{
q:"15. Segundo a LC nº 123/2006, os limites de receita bruta anual são:",
a:["A) ME até R$ 120.000,00 e EPP até R$ 1.200.000,00.","B) ME até R$ 360.000,00 e EPP acima de R$ 360.000,00 até R$ 4.800.000,00.","C) ME até R$ 81.000,00 e EPP até R$ 4.800.000,00.","D) limites fixados anualmente por decreto."],
c:1,
r:"Gabarito: B. ME: até R$ 360.000,00. EPP: acima de R$ 360.000,00 até R$ 4.800.000,00."
}
];

let atual = 0;
let pontos = 0;
let respondidas = Array(questoes.length).fill(false);

function carregarQuestao(){
  const item = questoes[atual];
  document.getElementById("contador").innerText = `Questão ${atual + 1} de ${questoes.length}`;

  document.getElementById("quiz").innerHTML = `
    <div class="card" id="card">
      <h3>${item.q}</h3>

      ${item.a.map((alt,j)=>`
        <div class="alternativa" onclick="responder(${j}, this)">
          ${alt}
        </div>
      `).join("")}

      <div class="resposta">${item.r}</div>

      <div class="botoes botoes-navegacao">
        <button onclick="voltar()">⬅️ Voltar</button>
        <button onclick="mostrarResposta()">👁️ Mostrar resposta</button>
        <button onclick="proxima()">Próxima ➡️</button>
        <button onclick="imprimirComResposta()">📄 PDF com resposta</button>
        <button onclick="imprimirSemResposta()">📄 PDF sem resposta</button>
      </div>
    </div>
  `;
}

function responder(j, el){
  if(respondidas[atual]) return;

  respondidas[atual] = true;

  const card = document.getElementById("card");
  const alternativas = card.querySelectorAll(".alternativa");

  alternativas.forEach((alt,index)=>{
    if(index === questoes[atual].c) alt.classList.add("correta");
    if(index === j && j !== questoes[atual].c) alt.classList.add("errada");
  });

  if(j === questoes[atual].c) pontos++;

  card.classList.add("exibir");
  atualizarScore();
}

function atualizarScore(){
  document.getElementById("score").innerText = `Pontuação: ${pontos} / ${questoes.length}`;
}

function mostrarResposta(){
  document.getElementById("card").classList.add("exibir");
}

function proxima(){
  if(atual < questoes.length - 1){
    atual++;
    carregarQuestao();
  }
}

function voltar(){
  if(atual > 0){
    atual--;
    carregarQuestao();
  }
}

function imprimirComResposta(){
  document.body.classList.remove("sem-resposta");
  document.body.classList.add("com-resposta");
  gerarTodasParaImpressao();
  window.print();
  carregarQuestao();
}

function imprimirSemResposta(){
  document.body.classList.remove("com-resposta");
  document.body.classList.add("sem-resposta");
  gerarTodasParaImpressao();
  window.print();
  carregarQuestao();
}

function gerarTodasParaImpressao(){
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  questoes.forEach((item,i)=>{
    quiz.innerHTML += `
      <div class="card">
        <h3>${item.q}</h3>
        ${item.a.map(alt=>`<div class="alternativa">${alt}</div>`).join("")}
        <div class="resposta">${item.r}</div>
      </div>
    `;
  });
}

carregarQuestao();
</script>

</body>
</html>
