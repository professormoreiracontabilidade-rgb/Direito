<script>
const questoes = [
{
q:`01. João comunicou a Maria que:

I. a Lei nº X, editada pela União, disciplinou as situações em que poderia ocorrer a renúncia a determinada posição jurídica;
II. a renúncia, para ser válida, deveria observar os estritos termos legais;
III. Pedro renunciou a um direito que deixou de integrar a sua esfera jurídica e, automaticamente, passou a integrar a esfera jurídica de Maria.

Nas situações descritas por João em I, II e III, estamos perante, respectivamente, os denominados:`,
a:[
`(A) poder estatal, direito positivo e direito natural.`,
`(B) direito objetivo, direito natural e faculdade jurídica.`,
`(C) direito positivo, direito objetivo e direito subjetivo.`,
`(D) direito subjetivo, direito natural e dinâmica relacional.`
],
c:2,
r:`✅ Gabarito: letra C

🔎 Item I
Lei editada pela União representa norma criada pelo Estado.
✔ Isso é direito positivo.

🔎 Item II
A renúncia deve observar os termos legais.
Aqui o foco está na norma em si.
✔ Isso é direito objetivo.

🔎 Item III
Pedro renunciou a um direito com efeito concreto na esfera jurídica de Maria.
✔ Isso é direito subjetivo.

🎯 Conclusão:
I → Direito positivo
II → Direito objetivo
III → Direito subjetivo

💡 Dica FGV:
Direito positivo → norma criada pelo Estado.
Direito objetivo → regra jurídica.
Direito subjetivo → poder do indivíduo.`
},

{
q:`02. Pedro é empregado, há exatos três anos, da sociedade empresária Alfa, que cumpria todas as suas obrigações, a começar pelo rigoroso pagamento do salário mensal dos seus empregados. No entanto, Maria, sua superior hierárquica, decidiu que Pedro não vinha cumprindo a contento suas obrigações, logo, deveria ser demitido.

À luz desse quadro, Maria consultou o Departamento de Recursos Humanos em relação à concessão de aviso prévio a Pedro, sendo-lhe corretamente informado que:`,
a:[
`(A) cabe a Alfa optar pela concessão de aviso prévio ou pela permanência de Pedro em casa, sem remuneração.`,
`(B) o aviso prévio a ser dado a Pedro é de 30 dias.`,
`(C) é necessário o pagamento de indenização correspondente a um mês de trabalho.`,
`(D) o aviso prévio a ser dado a Pedro é de 39 dias.`
],
c:3,
r:`✅ Gabarito: D

📌 Base legal:
Lei nº 12.506/2011.

🧠 Regra:
Mínimo: 30 dias.
Acrescenta-se 3 dias por ano completo de serviço.
Limite: 90 dias.

📊 Aplicando:
Pedro tem 3 anos completos.
30 dias + 3 × 3 anos = 39 dias.

🔎 Alternativas:
(A) Errada. Não pode ficar em casa sem remuneração.
(B) Errada. Não considerou a proporcionalidade.
(C) Errada. Não será necessariamente só um mês.
(D) Correta.

🎯 Dica:
A partir de 1 ano, soma 3 dias por ano completo.`
},

{
q:`03. A sociedade empresária Delta acabou de ser constituída, com estrita observância da sistemática legal, tendo por objeto a venda de livros. No dia imediatamente anterior ao início de suas atividades, os sócios da Delta questionaram o contador sobre a respectiva carga tributária, mais especificamente a respeito dos tributos que Delta estava obrigada a recolher.

O contador respondeu corretamente que Delta, em razão do seu objeto social:`,
a:[
`(A) não recolheria nenhum tributo.`,
`(B) somente recolheria impostos.`,
`(C) recolheria taxas.`,
`(D) somente recolheria contribuições de melhoria.`
],
c:2,
r:`✅ Gabarito: C

📚 Livros possuem imunidade tributária em relação a impostos.

⚠️ Atenção:
Imunidade tributária não significa ausência de todos os tributos.
Ela atinge impostos, mas não impede a cobrança de taxas.

🧾 Taxas decorrem:
✔ poder de polícia;
✔ serviços públicos específicos e divisíveis.

🎯 Conclusão:
Venda de livros → não paga impostos sobre livros, mas pode recolher taxas.

💡 Dica:
Imunidade tributária ≠ isenção total.`
},

{
q:`04. João recebeu comunicação da associação de moradores do Bairro Alfa informando que estava em débito com mensalidades desde a criação da associação, ocorrida dois anos antes. João informou que jamais se associara, logo, não poderia ter débitos pendentes. A associação afirmou que isso seria irrelevante, pois suas conquistas geravam benefícios para João, morador do bairro.

À luz dessa narrativa, é correto afirmar que:`,
a:[
`(A) como é obrigatória a associação de João, o débito é devido, embora ele possa se desassociar a qualquer momento.`,
`(B) ainda que seja beneficiado pelos atos da associação, cabe a João decidir se irá se associar, ou não, logo, o débito é indevido.`,
`(C) caso a associação tenha sido criada com autorização do Município, a associação de João é obrigatória e o débito é devido.`,
`(D) como as associações não têm fins lucrativos, é vedada a cobrança de mensalidades, logo, o débito é indevido.`
],
c:1,
r:`✅ Gabarito: B

📌 Fundamento:
A Constituição garante liberdade de associação.

📍 Regra:
Ninguém é obrigado a se associar.
Ninguém é obrigado a permanecer associado.

🧠 Aplicação:
João nunca se associou.
Logo:
✔ não há vínculo jurídico;
✔ não há obrigação de pagar mensalidade.

⚠️ Mesmo que ele seja beneficiado indiretamente, isso não gera obrigação de pagamento.

🎯 Dica:
Associação de moradores + cobrança de não associado = não pode cobrar.`
},

{
q:`05. A sociedade empresária Alfa desejava celebrar contrato com o Estado Beta para fornecer móveis destinados a escolas públicas em construção. Ao consultar um especialista, foi corretamente informado ao sócio-gerente de Alfa que:`,
a:[
`(A) os contratos celebrados pelo Estado sempre seguem os mesmos parâmetros dos contratos de direito privado, logo, Alfa celebraria contrato de compra e venda de bens móveis.`,
`(B) todo contrato celebrado pelo Estado Beta deve ser antecedido de licitação, logo, Alfa somente poderia fornecer móveis caso vencesse licitação.`,
`(C) ressalvadas as exceções legais, eventual celebração de contrato administrativo com o Estado Beta exigiria que Alfa fosse vencedora em licitação.`,
`(D) em razão do princípio da eficiência, a licitação é reservada às situações em que a autoridade identifique possibilidade de competição.`
],
c:2,
r:`✅ Gabarito: C

📌 Regra geral:
A Administração Pública deve licitar antes de contratar.

⚠️ Exceção:
Há hipóteses legais de dispensa e inexigibilidade.

🔎 Alternativas:
(A) Errada. Contratos administrativos possuem regime jurídico próprio.
(B) Errada. "Todo contrato" é generalização indevida.
(C) Correta. Traz a regra com a ressalva das exceções legais.
(D) Errada. Licitação não é mera opção da autoridade.

🎯 Dica:
Licitação = regra.
Dispensa e inexigibilidade = exceções.`
},

{
q:`06. Ana trabalhava em um escritório de contabilidade e foi questionada por Maria sobre os pontos de aproximação e distanciamento entre previdência e assistência social, especialmente quanto ao caráter contributivo.

À luz desse questionamento, Ana respondeu corretamente que:`,
a:[
`(A) ambas oferecem direitos prestacionais e têm caráter necessariamente contributivo.`,
`(B) a assistência social assegura benefícios independentemente de qualquer contribuição.`,
`(C) a assistência social se aproxima das características da previdência pública, mas se diferencia da previdência privada.`,
`(D) a assistência social é uma das formas de expressão da previdência social, seguindo as regras gerais desta última.`
],
c:1,
r:`✅ Gabarito: B

📌 Seguridade Social:
✔ Saúde;
✔ Previdência Social;
✔ Assistência Social.

🧠 Diferença essencial:
Previdência Social → contributiva.
Assistência Social → não contributiva.
Saúde → não contributiva.

📌 Exemplo:
BPC/LOAS é benefício assistencial e independe de contribuição previdenciária.

🎯 Dica:
Assistência social = não contributiva.`
},

{
q:`07. João vendera determinada mercadoria para Pedro, mas não recebeu o pagamento. Com a proximidade do prazo prescricional, ficou preocupado. Pedro disse que renunciaria à prescrição.

Ao analisar o Código Civil, João concluiu corretamente que a renúncia que Pedro se propôs a realizar:`,
a:[
`(A) não é admitida pela sistemática legal.`,
`(B) deve ser expressa, sendo vedada a renúncia tácita.`,
`(C) só pode ser realizada depois que a prescrição se consumar.`,
`(D) pode ser realizada antes ou após a consumação da prescrição, sendo expressa ou tácita.`
],
c:2,
r:`✅ Gabarito: C

📌 Regra:
A renúncia à prescrição só pode ocorrer depois de consumada.

🧠 Ideia central:
Antes da prescrição, há apenas expectativa.
Depois de consumada, surge direito disponível do devedor.

📍 Forma:
A renúncia pode ser expressa ou tácita.

🔎 Alternativas:
(A) Errada. A renúncia é admitida.
(B) Errada. Pode ser expressa ou tácita.
(C) Correta.
(D) Errada. Não pode ocorrer antes.

🎯 Dica:
Renúncia antes da prescrição = errado.`
},

{
q:`08. João e Maria, únicos sócios da sociedade Alfa, faleceram em acidente automobilístico, não sendo possível saber quem faleceu primeiro. Como havia relação de parentesco, o momento da morte influenciaria a vocação hereditária e a transmissão das cotas.

Nesse caso, segundo o Código Civil, deve-se presumir que:`,
a:[
`(A) o mais velho faleceu primeiro.`,
`(B) o mais jovem faleceu primeiro.`,
`(C) faleceram ao mesmo tempo.`,
`(D) o que teve o inventário aberto antes faleceu primeiro.`
],
c:2,
r:`✅ Gabarito: C

⚖️ Comoriência:
É a presunção de morte simultânea quando pessoas morrem no mesmo evento e não se pode determinar quem morreu primeiro.

🎯 Consequência:
Não há transmissão de direitos entre os comorientes.

Exemplo:
João não herda de Maria.
Maria não herda de João.

🔎 Alternativas:
(A) Errada. Idade não importa.
(B) Errada. Idade não importa.
(C) Correta.
(D) Errada. Inventário não define ordem de morte.

💡 Dica:
Não sabe quem morreu primeiro = comoriência.`
},

{
q:`09. Joana tomou ciência de que órgão colegiado de jurisdição administrativa, competente para julgar recursos relacionados ao imposto X, proferiu decisão à qual a lei atribui eficácia normativa.

Após analisar o Código Tributário Nacional quanto à entrada em vigor dos efeitos normativos da decisão, Joana concluiu corretamente que tais efeitos devem ocorrer, salvo disposição em contrário:`,
a:[
`(A) na data da sua publicação.`,
`(B) trinta dias após a data da sua publicação.`,
`(C) noventa dias após a data da sua publicação.`,
`(D) no exercício financeiro seguinte à data da sua publicação.`
],
c:1,
r:`✅ Gabarito: B

📌 Regra do CTN:
Atos normativos tributários, incluindo decisões administrativas com eficácia normativa, entram em vigor 30 dias após a publicação, salvo disposição em contrário.

⚠️ Pegadinha:
Não confundir com:
❌ anterioridade anual;
❌ noventena.

🎯 Aqui a regra é:
30 dias após a publicação.`
},

{
q:`10. Avalie se os princípios da Administração Pública incluem:

I. a legalidade;
II. a moralidade;
III. a livre concorrência;
IV. a publicidade.

São de fato princípios da Administração Pública os itens:`,
a:[
`(A) I e II, apenas.`,
`(B) II, III e IV, apenas.`,
`(C) I, II e IV, apenas.`,
`(D) I, II, III e IV.`
],
c:2,
r:`✅ Gabarito: C

📌 Princípios constitucionais da Administração Pública:
LIMPE:
✔ Legalidade;
✔ Impessoalidade;
✔ Moralidade;
✔ Publicidade;
✔ Eficiência.

🔎 Análise:
I. Legalidade → correto.
II. Moralidade → correto.
III. Livre concorrência → errado. É princípio da ordem econômica.
IV. Publicidade → correto.

🎯 Conclusão:
Itens I, II e IV.

💡 Dica:
Livre concorrência, defesa do consumidor e livre iniciativa costumam aparecer como pegadinhas da ordem econômica.`
},

{
q:`11. Entre as limitações ao poder de tributar previstas na Constituição Federal de 1988, estão princípios que estabelecem limites ao poder de tributar e garantem segurança jurídica e justiça fiscal.

Sobre esse tema, assinale a afirmativa correta:`,
a:[
`(A) O princípio da anterioridade nonagesimal estabelece que nenhum tributo pode ser cobrado antes de 90 dias da publicação da sua instituição ou majoração, exceto contribuições sociais, que podem ser exigidas imediatamente.`,
`(B) O princípio da legalidade tributária determina que nenhum tributo pode ser instituído ou majorado sem previsão em lei complementar.`,
`(C) O princípio da isonomia garante tratamento igualitário a todos que se encontram em situação equivalente, sendo proibida distinção em razão de ocupação profissional ou função exercida.`,
`(D) O princípio da irretroatividade veda a aplicação da lei a ato ou fato pretérito, ainda que a lei seja expressamente interpretativa.`
],
c:2,
r:`✅ Gabarito: C

🔎 Alternativa A:
Errada. Contribuições sociais também se submetem à noventena.

🔎 Alternativa B:
Errada. A regra é lei, não necessariamente lei complementar.

🔎 Alternativa C:
Correta. A isonomia tributária exige tratamento igual aos contribuintes em situação equivalente.

🔎 Alternativa D:
Errada. Lei interpretativa pode retroagir, desde que não gere penalidade mais gravosa.

💡 Dica:
Legalidade → lei.
Isonomia → igualdade.
Irretroatividade → não alcança fatos passados, salvo exceções.
Anterioridade → protege o contribuinte contra cobrança imediata.`
},

{
q:`12. A empresa Alfa Indústria Ltda. levantou suas obrigações tributárias ao final de julho, verificando ICMS, ISS e IRPJ devidos.

Com base nos conceitos de obrigação tributária e tributo, assinale a afirmativa correta:`,
a:[
`(A) O ISS e o ICMS são impostos de mesma competência tributária, pois ambos são devidos aos Estados.`,
`(B) A obrigação tributária principal consiste no pagamento do tributo devido, enquanto a obrigação tributária acessória está relacionada a deveres instrumentais, como emissão de notas fiscais e declarações ao Fisco.`,
`(C) O IRPJ, por ser imposto sobre a renda, é classificado como tributo indireto, pois seu ônus pode ser repassado ao consumidor.`,
`(D) O fato gerador do ICMS ocorre quando a empresa apura seus lucros ao final do exercício contábil.`
],
c:1,
r:`✅ Gabarito: B

🔎 Alternativa A:
Errada. ICMS é de competência dos Estados e DF. ISS é de competência dos Municípios.

🔎 Alternativa B:
Correta. Obrigação principal é pagar. Obrigação acessória é cumprir deveres instrumentais.

🔎 Alternativa C:
Errada. IRPJ é tributo direto.

🔎 Alternativa D:
Errada. ICMS tem relação com circulação de mercadorias e determinados serviços, não com lucro.

💡 Dica:
Principal = pagar.
Acessória = fazer, declarar, escriturar, emitir nota.`
},

{
q:`13. Para o contador que atua no setor público ou na fiscalização de contratos administrativos, o conhecimento da Lei nº 14.133/2021 é fundamental para a avaliação da legalidade e conformidade dos gastos públicos.

O Art. 5º dessa Lei elenca diversos princípios que devem guiar a atuação das Administrações Públicas diretas, autárquicas e fundacionais da União, dos Estados, do Distrito Federal e dos Municípios.

Com base no texto legal, avalie os seguintes princípios:

I. Impessoalidade;
II. Transparência;
III. Racionalidade econômica;
IV. Probidade administrativa.

Estão expressamente listados no Art. 5º da Lei os princípios:`,
a:[
`(A) I e IV, apenas.`,
`(B) II e III, apenas.`,
`(C) I, II e IV, apenas.`,
`(D) I, II, III e IV.`
],
c:2,
r:`✅ Gabarito: C

📌 Art. 5º da Lei nº 14.133/2021:
Entre os princípios expressamente previstos estão:
✔ Impessoalidade;
✔ Transparência;
✔ Probidade administrativa.

⚠️ Atenção:
Racionalidade econômica pode até parecer adequada, mas não está expressamente listada no art. 5º.

🔎 Análise:
I. Impessoalidade → sim.
II. Transparência → sim.
III. Racionalidade econômica → não.
IV. Probidade administrativa → sim.

🎯 Conclusão:
I, II e IV.`
},

{
q:`14. Um estudante de contabilidade, ao iniciar seus estudos em Direito Tributário, busca a definição legal de tributo contida no Código Tributário Nacional.

De acordo com esse diploma legal, assinale a opção que define corretamente o tributo:`,
a:[
`(A) Tributo é toda prestação pecuniária voluntária, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída por medida provisória e cobrada mediante atividade administrativa com alguma discricionariedade.`,
`(B) Tributo é toda sanção de ato ilícito, cobrada compulsoriamente em bens ou serviços, instituída em lei e aplicada com base em decisões discricionárias da administração pública.`,

let atual = 0;
let pontos = 0;
let respondidas = Array(questoes.length).fill(false);
let respostasAluno = Array(questoes.length).fill(null);

function carregarQuestao(){
  const q = questoes[atual];

  document.getElementById("contador").innerText = `Questão ${atual + 1} de ${questoes.length}`;

  document.getElementById("quiz").innerHTML = `
    <div class="card" id="card">
      <div class="enunciado">${q.q}</div>

      ${q.a.map((alt,i)=>`
        <div class="alternativa" onclick="responder(${i})">${alt}</div>
      `).join("")}

      <div class="resposta">${q.r}</div>

      <div class="botoes">
        <button onclick="voltar()">⬅️ Voltar</button>
        <button onclick="mostrarResposta()">👁️ Mostrar resposta</button>
        <button onclick="proxima()">Próxima ➡️</button>
        <button onclick="imprimirComResposta()">📄 PDF com respostas</button>
        <button onclick="imprimirSemResposta()">📄 PDF sem respostas</button>
        <button onclick="reiniciar()">🔄 Reiniciar</button>
      </div>
    </div>
  `;

  restaurarVisual();
  atualizarPainel();
}

function responder(i){
  if(respondidas[atual]) return;

  respondidas[atual] = true;
  respostasAluno[atual] = i;

  if(i === questoes[atual].c){
    pontos++;
  }

  marcarAlternativas();
  document.getElementById("card").classList.add("exibir");

  atualizarScore();
  atualizarPainel();
}

function marcarAlternativas(){
  const alternativas = document.querySelectorAll(".alternativa");

  alternativas.forEach((alt,index)=>{
    if(index === questoes[atual].c){
      alt.classList.add("correta");
    }

    if(index === respostasAluno[atual] && index !== questoes[atual].c){
      alt.classList.add("errada");
    }
  });
}

function restaurarVisual(){
  if(respondidas[atual]){
    marcarAlternativas();
    document.getElementById("card").classList.add("exibir");
  }
}

function atualizarScore(){
  document.getElementById("score").innerText = `Pontuação: ${pontos} / ${questoes.length}`;
}

function atualizarPainel(){
  const painel = document.getElementById("painelQuestoes");
  painel.innerHTML = "";

  questoes.forEach((q,i)=>{
    let status = "⏳";

    if(respondidas[i]){
      status = respostasAluno[i] === questoes[i].c ? "✅" : "❌";
    }

    painel.innerHTML += `
      <button class="btn-numero ${i === atual ? 'ativo' : ''}" onclick="irPara(${i})">
        ${i + 1} ${status}
      </button>
    `;
  });
}

function irPara(i){
  atual = i;
  carregarQuestao();
}

function mostrarResposta(){
  document.getElementById("card").classList.add("exibir");
}

function proxima(){
  if(atual < questoes.length - 1){
    atual++;
    carregarQuestao();
  }
}

function voltar(){
  if(atual > 0){
    atual--;
    carregarQuestao();
  }
}

function reiniciar(){
  atual = 0;
  pontos = 0;
  respondidas = Array(questoes.length).fill(false);
  respostasAluno = Array(questoes.length).fill(null);
  atualizarScore();
  carregarQuestao();
}

function gerarTodas(){
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  questoes.forEach((q)=>{
    quiz.innerHTML += `
      <div class="card">
        <div class="enunciado">${q.q}</div>
        ${q.a.map(alt=>`<div class="alternativa">${alt}</div>`).join("")}
        <div class="resposta">${q.r}</div>
      </div>
    `;
  });
}

function imprimirComResposta(){
  document.body.classList.remove("sem-resposta");
  document.body.classList.add("com-resposta");
  gerarTodas();
  window.print();
  carregarQuestao();
}

function imprimirSemResposta(){
  document.body.classList.remove("com-resposta");
  document.body.classList.add("sem-resposta");
  gerarTodas();
  window.print();
  carregarQuestao();
}

carregarQuestao();
atualizarScore();
</script>
